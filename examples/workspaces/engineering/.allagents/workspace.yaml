version: 2

repositories: []

plugins:
  # Keep established Compound workflow entry points even where Matt overlaps.
  # The shipping skills below are the hard dependency closure for work/debug.
  - source: https://github.com/EveryInc/compound-engineering-plugin
    skills:
      - ce-promote
      - ce-code-review
      - ce-ideate
      - ce-brainstorm
      - ce-plan
      - ce-simplify-code
      - ce-debug
      - ce-pov
      - ce-work
      - ce-commit
      - ce-commit-push-pr
      - ce-babysit-pr
      - ce-resolve-pr-feedback

  # These three capabilities are adapted in this repository because their upstream
  # versions hard-invoke unselected helper skills. The allowlist keeps the
  # public Matt skill set exact and prevents future additions from auto-enabling.
  # Relative plugin sources resolve from the workspace root; this path requires
  # the repository's examples/ and skills/ layout rather than a standalone copy.
  - source: ../../../skills/matt-pocock-engineering
    skills:
      - engineering/wayfinder
      - engineering/grill-with-docs
      - engineering/improve-codebase-architecture

  - source: https://github.com/NousResearch/hermes-agent
    skills:
      - research/llm-wiki

clients:
  - universal
